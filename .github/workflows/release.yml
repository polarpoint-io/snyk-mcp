name: Release

# Triggered by pushing a version tag: git tag v1.2.3 && git push --tags
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write       # create GitHub release + attach assets
  packages: write       # push to GHCR
  id-token: write       # PyPI trusted publishing (OIDC)

jobs:
  # -----------------------------------------------------------------------
  # 1. Run the test suite before releasing anything
  # -----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

  # -----------------------------------------------------------------------
  # 2. Build Python sdist + wheel and publish to PyPI via OIDC
  # -----------------------------------------------------------------------
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pysnyk-mcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed — uses GitHub OIDC.
        # Configure a "trusted publisher" in your PyPI project settings:
        #   Publisher: GitHub Actions
        #   Owner:     polarpoint-io
        #   Repo:      snyk-mcp
        #   Workflow:  release.yml
        #   Environment: pypi

  # -----------------------------------------------------------------------
  # 3. Build and push the Docker image to GHCR
  # -----------------------------------------------------------------------
  ghcr:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # tag with the semver from the git tag, e.g. v1.2.3 → 1.2.3 and 1.2 and 1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # always tag latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------
  # 4. Create a GitHub Release with the built artifacts attached
  # -----------------------------------------------------------------------
  github-release:
    needs: [pypi, ghcr]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog generation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution artifacts
        run: |
          pip install build
          python -m build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "pysnyk-mcp ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
