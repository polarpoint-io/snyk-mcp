version: "3.9"

services:
  pysnyk-mcp:
    build: .
    image: pysnyk-mcp:latest
    environment:
      - SNYK_TOKEN=${SNYK_TOKEN}
      - TRANSPORT=http
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    restart: unless-stopped
